<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projet — Assistant chef de projet</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <aside>
    <a class="brand" href="/">
      <span class="logo">CDP</span>
      <span><span class="t">Assistant CDP</span><br><span class="s">Pilotage du projet</span></span>
    </a>
    <div class="rule"></div>
    <nav id="nav"></nav>
  </aside>
  <div class="wrap">
    <div class="top">
      <h1 id="titre-projet">Projet</h1>
      <span class="hint" id="etape-projet"></span>
      <div class="search">
        <input id="q" type="text" placeholder="Rechercher un ID, un mot..." autocomplete="off">
        <kbd>Échap</kbd>
      </div>
      <div id="results"></div>
    </div>
    <main id="view"></main>
  </div>
  <div id="shade"></div>
  <div id="drawer">
    <header>
      <div>
        <div class="ty" id="dr-ty"></div>
        <h2 id="dr-titre"></h2>
        <div id="dr-pills"></div>
      </div>
      <button id="dr-close" title="Fermer">×</button>
    </header>
    <div class="body" id="dr-body"></div>
  </div>
  <div id="err"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui.js"></script>
  <!-- vues : chaque fichier enregistre window.VUES[cle] = fn -->
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/synthese.js"></script>
  <script src="/static/js/registre.js"></script>
  <script src="/static/js/documents.js"></script>
  <script src="/static/js/planning.js"></script>
  <script src="/static/js/interlocuteurs.js"></script>
  <script src="/static/js/checklists.js"></script>
  <script src="/static/js/reunions.js"></script>
  <script src="/static/js/scenarios.js"></script>
  <script src="/static/js/router.js"></script>
</body>
</html>
