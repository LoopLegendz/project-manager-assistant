<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projet — Assistant chef de projet</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/">&larr; Accueil</a>
    <h1 id="titre-projet">Projet</h1>
    <span class="badge" id="badge-etape"></span>
    <a id="lien-dashboard" href="#" style="font-size:14px">Tableau de bord</a>
  </header>
  <main>
    <div id="zone-attente" class="carte" style="display:none">
      <div class="spinner" id="texte-attente">Analyse en cours...</div>
    </div>
    <div id="zone-questions" class="carte" style="display:none">
      <h2>Quelques questions avant de créer l'espace projet</h2>
      <form id="form-questions"></form>
    </div>
    <div id="zone-chat" class="carte" style="display:none">
      <h2>Conversation</h2>
      <div class="chat" id="chat"></div>
      <form class="chat-form" id="form-chat">
        <input type="text" id="input-chat" placeholder="Écrivez à l'assistant..." autocomplete="off">
        <button type="submit" id="btn-chat">Envoyer</button>
        <button type="button" id="btn-annuler" style="display:none;background:#b91c1c">Annuler</button>
      </form>
      <div id="statut-chat"></div>
    </div>
  </main>
  <script>
    const idProjet = window.location.pathname.split('/').pop();
    document.getElementById('lien-dashboard').href = '/projet/' + idProjet + '/dashboard';
    let etape = null;

    async function charger() {
      const r = await fetch('/api/projets/' + idProjet);
      if (!r.ok) { document.body.innerHTML = '<main><div class="erreur">Projet introuvable.</div></main>'; return; }
      const data = await r.json();
      etape = data.etape;
      document.getElementById('titre-projet').textContent = data.nom || idProjet;
      document.getElementById('badge-etape').textContent = etape;
      document.getElementById('zone-attente').style.display = 'none';
      document.getElementById('zone-questions').style.display = 'none';
      document.getElementById('zone-chat').style.display = 'none';

      if (etape === 'questions' && data.pre_analyse && data.pre_analyse.questions) {
        afficherQuestions(data.pre_analyse.questions, data.tour);
      } else if (etape === 'actif') {
        document.getElementById('zone-chat').style.display = 'block';
        chargerChat();
      } else if (etape === 'description') {
        document.getElementById('zone-attente').style.display = 'block';
        document.getElementById('texte-attente').innerHTML =
          'Ce projet n\'a pas été créé via l\'interface (pas de parcours d\'amorçage). ' +
          'Pour le nettoyer : supprimez son dossier dans <code>assistant-cdp/projets/' + idProjet + '</code>.';
      } else {
        document.getElementById('zone-attente').style.display = 'block';
        document.getElementById('texte-attente').textContent =
          etape === 'pre_analyse' ? 'Pré-analyse en cours...' :
          etape === 'creation' ? 'Création de l\'espace projet en cours (plusieurs minutes)...' :
          'Chargement...';
        setTimeout(charger, 15000);
      }
    }

    function afficherQuestions(questions, tour) {
      const zone = document.getElementById('zone-questions');
      zone.style.display = 'block';
      const form = document.getElementById('form-questions');
      form.innerHTML = '';
      if (tour >= 2) {
        form.innerHTML += '<p class="cout">Dernier tour de questions.</p>';
      }
      for (const q of questions) {
        const div = document.createElement('div');
        div.className = 'question';
        div.innerHTML = `<div class="q-texte"><b>${q.id}</b> — ${q.question}</div>
          <div class="q-pourquoi">${q.pourquoi || ''}</div>`;
        const input = document.createElement('input');
        input.type = 'text';
        input.name = q.id;
        input.placeholder = q.proposition_par_defaut ? 'Par défaut : ' + q.proposition_par_defaut : '';
        input.style.marginTop = '4px';
        div.appendChild(input);
        form.appendChild(div);
      }
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.textContent = 'Envoyer les réponses';
      form.appendChild(btn);
    }

    document.getElementById('form-questions').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const reponses = {};
      for (const input of form.querySelectorAll('input[type=text]')) {
        reponses[input.name] = input.value;
      }
      form.querySelector('button').disabled = true;
      document.getElementById('zone-attente').style.display = 'block';
      document.getElementById('texte-attente').textContent = 'Intégration des réponses...';
      document.getElementById('zone-questions').style.display = 'none';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 1800000); // 30 min max (P2+P3)
        const r = await fetch('/api/projets/' + idProjet + '/reponses', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reponses }),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || r.statusText);
        charger();
      } catch (err) {
        const msg = err.name === 'AbortError'
          ? 'Délai dépassé (45 min) ou serveur injoignable (réseau coupé ?). Rechargez la page pour voir si le traitement a abouti.'
          : err.message;
        document.getElementById('texte-attente').innerHTML = `<div class="erreur">${msg}</div>`;
        form.querySelector('button').disabled = false;
      }
    });

    async function chargerChat() {
      const r = await fetch('/api/projets/' + idProjet + '/chat');
      const data = await r.json();
      const chat = document.getElementById('chat');
      chat.innerHTML = '';
      for (const m of data.messages) ajouterMsg(chat, m);
      chat.scrollTop = chat.scrollHeight;
    }

    function renduTexte(t) {
      let s = String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      s = s.replace(/\n/g, '<br>');
      return s;
    }

    function ajouterMsg(chat, m) {
      const div = document.createElement('div');
      div.className = 'msg ' + m.role;
      div.innerHTML = renduTexte(m.texte);
      chat.appendChild(div);
      if (m.role === 'assistant' && (m.cost_usd != null || m.duree_s != null)) {
        const meta = document.createElement('div');
        meta.className = 'msg meta';
        meta.textContent = `${m.duree_s ?? '?'}s — ${m.cost_usd != null ? m.cost_usd.toFixed(4) + ' USD' : ''}`;
        chat.appendChild(meta);
      }
    }

    document.getElementById('form-chat').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('input-chat');
      const btn = document.getElementById('btn-chat');
      const statut = document.getElementById('statut-chat');
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      btn.disabled = true;
      const btnAnnuler = document.getElementById('btn-annuler');
      btnAnnuler.style.display = 'inline-block';
      statut.innerHTML = '<div class="spinner">L\'assistant réfléchit...</div>';
      const chat = document.getElementById('chat');
      ajouterMsg(chat, { role: 'user', texte: message });
      let ctrl = null;
      try {
        ctrl = new AbortController();
        window.__ctrlChat = ctrl;
        const timer = setTimeout(() => ctrl.abort(), 300000); // 5 min max (chat)
        const r = await fetch('/api/projets/' + idProjet + '/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        const data = await r.json();
        if (r.status === 409) throw new Error(data.detail || 'Un run est déjà en cours, réessayez dans un instant.');
        if (!r.ok) throw new Error(data.detail || r.statusText);
        ajouterMsg(chat, { role: 'assistant', texte: data.reponse, cost_usd: data.cost_usd, duree_s: data.duree_s });
        statut.innerHTML = '';
      } catch (err) {
        if (err.name === 'AbortError') {
          statut.innerHTML = '<div class="erreur">Requête annulée. Le run continue côté serveur : rechargez la page dans quelques minutes pour voir la réponse.</div>';
        } else {
          statut.innerHTML = `<div class="erreur">${err.message}</div>`;
        }
      }
      btn.disabled = false;
      btnAnnuler.style.display = 'none';
      chat.scrollTop = chat.scrollHeight;
    });

    document.getElementById('btn-annuler').addEventListener('click', () => {
      if (window.__ctrlChat) window.__ctrlChat.abort();
    });

    charger();
  </script>
</body>
</html>
